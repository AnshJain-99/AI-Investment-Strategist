<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        InvestIQ
        {% endblock %}
    </title>


    <!-- Bootstrap CSS -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >


    <!-- Design system fonts -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- Custom CSS -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
    <!-- Keep this version aligned with the Plotly Python package (6.9.0). -->
    <script src="https://cdn.plot.ly/plotly-3.7.0.min.js"></script>

    {% block styles %}
    {% endblock %}

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/theme.css') }}"
    >


</head>


<body>


{% if current_user.is_authenticated %}


<!-- ==========================================
     MAIN APPLICATION
========================================== -->

<div class="app-layout">


    <!-- FULL-WIDTH TOP NAVBAR -->

    {% include "partials/navbar.html" %}


    <!-- PAGE CONTENT -->

    <main class="page-content">

        {% block content %}

        {% endblock %}

    </main>
    


</div>



{% else %}


<!-- LOGIN AND REGISTER PAGES -->

{% block auth %}

{% endblock %}


{% endif %}


<!-- Bootstrap JavaScript -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
{% block scripts %}

{% endblock %}

</body>

</html>

<!-- ==========================================
     FULL WIDTH NAVBAR
========================================== -->

<header class="top-navbar">

    <!-- LEFT SECTION -->

    <div class="navbar-left">

        <!-- BRAND / LOGO -->

        <a href="/dashboard" class="navbar-brand">

            <div class="navbar-brand-icon">

                <i class="bi bi-graph-up-arrow"></i>

            </div>

            <div class="navbar-brand-text">

                <h4>AI Investment</h4>

                <span>Strategist</span>

            </div>

        </a>


        <!-- NAVIGATION LINKS -->

        <nav class="top-nav-links" id="topNavLinks">

            <a href="/dashboard"
               class="top-nav-item{% if request.path == '/dashboard' %} active{% endif %}"
               id="nav-dashboard">
                Dashboard
            </a>

            <a href="/dashboard#market"
               class="top-nav-item{% if request.path == '/dashboard' and request.args.get('section') == 'market' %} active{% endif %}"
               id="nav-market">
                Market
            </a>

            <a href="{{ url_for('compare') }}"
               class="top-nav-item{% if request.path == url_for('compare') %} active{% endif %}"
               id="nav-compare">
                Compare Stocks
            </a>

            <a href="{{ url_for('watchlist') }}"
               class="top-nav-item{% if request.path == url_for('watchlist') %} active{% endif %}"
               id="nav-watchlist">
                Watchlist
            </a>

            <!-- Sliding underline indicator -->
            <span class="nav-slider" id="navSlider"></span>

        </nav>

    </div>


    <!-- RIGHT SECTION -->

    <div class="navbar-right">


        <!-- STOCK SEARCH -->

        <div class="navbar-search-wrapper">

            <form action="/analysis" method="GET" class="navbar-search-form" autocomplete="off">

                <i class="bi bi-search"></i>

                <input type="text" id="stockSearch" name="symbol" placeholder="Search stocks..." autocomplete="off">

            </form>


            <!-- SEARCH SUGGESTIONS -->

            <div id="stockSuggestions" class="stock-suggestions">

                <!-- Results will be added by JavaScript -->

            </div>

        </div>


        <!-- NOTIFICATION -->

        <button type="button" class="navbar-icon-button" title="Notifications">

            <i class="bi bi-bell"></i>

        </button>


        <!-- USER PROFILE -->

        <div class="navbar-profile">

            <button class="profile-button" type="button" id="profileDropdownButton">

                <!-- Sirf naam ka first letter -->

                <div class="profile-avatar">

                    {{ current_user.full_name[0]|upper }}

                </div>


                <!-- User ka poora naam -->

                <div class="profile-information">

                    <strong>

                        {{ current_user.full_name }}

                    </strong>

                    <span>Investor</span>

                </div>


                <i class="bi bi-chevron-down"></i>

            </button>


            <!-- PROFILE DROPDOWN -->

            <div class="profile-dropdown" id="profileDropdown">

                <div class="profile-dropdown-header">

                    <!-- Dropdown avatar -->

                    <div class="profile-avatar">

                        {{ current_user.full_name[0]|upper }}

                    </div>


                    <!-- Dropdown user information -->

                    <div>

                        <strong>

                            {{ current_user.full_name }}

                        </strong>

                        <span>Investor Account</span>

                    </div>

                </div>


                <div class="dropdown-divider"></div>


                <a href="#">

                    <i class="bi bi-person"></i>

                    My Profile

                </a>


                <a href="#">

                    <i class="bi bi-gear"></i>

                    Settings

                </a>


                <div class="dropdown-divider"></div>


                <a href="/logout" class="dropdown-logout">

                    <i class="bi bi-box-arrow-right"></i>

                    Logout

                </a>

            </div>

        </div>

</header>


<!-- ==========================================
     NAVBAR JAVASCRIPT
========================================== -->

<script>

    document.addEventListener("DOMContentLoaded", function () {


        /* ======================================
           PROFILE DROPDOWN
        ====================================== */


        const profileButton =
            document.getElementById(
                "profileDropdownButton"
            );


        const profileDropdown =
            document.getElementById(
                "profileDropdown"
            );


        if (
            profileButton &&
            profileDropdown
        ) {


            profileButton.addEventListener(
                "click",
                function (event) {

                    event.stopPropagation();

                    profileDropdown.classList.toggle(
                        "show"
                    );

                }
            );


            document.addEventListener(
                "click",
                function () {

                    profileDropdown.classList.remove(
                        "show"
                    );

                }
            );


            profileDropdown.addEventListener(
                "click",
                function (event) {

                    event.stopPropagation();

                }
            );

        }


        /* ======================================
           SLIDING NAV INDICATOR
        ====================================== */

        (function () {

            const slider  = document.getElementById("navSlider");
            const navLinks = document.querySelectorAll(".top-nav-links .top-nav-item");

            if (!slider || !navLinks.length) return;

            /* Move slider to a given element */
            function moveSlider(el) {

                const navRect = document.getElementById("topNavLinks").getBoundingClientRect();
                const elRect  = el.getBoundingClientRect();

                slider.style.left  = (elRect.left - navRect.left + 13) + "px";
                slider.style.width = (elRect.width - 26) + "px";
                slider.style.opacity = "1";

            }

            /* Position on the server-set active link immediately (no animation) */
            const initialActive = document.querySelector(".top-nav-links .top-nav-item.active");

            if (initialActive) {

                slider.style.transition = "none";
                moveSlider(initialActive);

                /* Re-enable animation after first paint */
                requestAnimationFrame(function () {
                    requestAnimationFrame(function () {
                        slider.style.transition = "left 0.3s cubic-bezier(.4,0,.2,1), width 0.3s cubic-bezier(.4,0,.2,1), opacity 0.2s";
                    });
                });

            } else {

                slider.style.opacity = "0";

            }

            /* On click: move active class + slider */
            navLinks.forEach(function (link) {

                link.addEventListener("click", function () {

                    navLinks.forEach(function (l) { l.classList.remove("active"); });
                    link.classList.add("active");
                    moveSlider(link);

                });

            });

        })();


        /* ======================================
           STOCK SEARCH
        ====================================== */


        const searchInput =
            document.getElementById(
                "stockSearch"
            );


        const suggestionBox =
            document.getElementById(
                "stockSuggestions"
            );


        let searchTimer;


        if (
            searchInput &&
            suggestionBox
        ) {


            searchInput.addEventListener(
                "input",
                function () {


                    clearTimeout(
                        searchTimer
                    );


                    const query =
                        searchInput.value.trim();


                    if (
                        query.length < 1
                    ) {

                        suggestionBox.innerHTML = "";

                        suggestionBox.classList.remove(
                            "show"
                        );

                        return;

                    }


                    suggestionBox.innerHTML = `

                    <div class="search-loading">

                        <span
                            class="spinner-border
                                   spinner-border-sm">
                        </span>

                        Searching stocks...

                    </div>

                `;


                    suggestionBox.classList.add(
                        "show"
                    );


                    searchTimer = setTimeout(

                        async function () {


                            try {


                                const response =
                                    await fetch(

                                        `/api/search-stocks?q=${encodeURIComponent(
                                            query
                                        )}`

                                    );


                                const stocks =
                                    await response.json();


                                suggestionBox.innerHTML = "";


                                if (
                                    stocks.length === 0
                                ) {


                                    suggestionBox.innerHTML = `

                                    <div class="no-search-result">

                                        No stocks found

                                    </div>

                                `;


                                    return;

                                }


                                stocks.forEach(

                                    function (stock) {


                                        const item =
                                            document.createElement(
                                                "a"
                                            );


                                        item.className =
                                            "stock-suggestion-item";

                                        item.onclick = function () {

                                            localStorage.setItem(
                                                "selectedStock",
                                                stock.symbol
                                            );

                                        };
                                        item.href =

                                            `/analysis?symbol=${encodeURIComponent(

                                                stock.symbol

                                            )}`;


                                        item.innerHTML = `

                                        <div
                                            class="suggestion-stock-icon"
                                        >

                                            <i
                                                class="bi
                                                       bi-graph-up-arrow"
                                            ></i>

                                        </div>


                                        <div
                                            class="suggestion-stock-info"
                                        >

                                            <strong>

                                                ${stock.name}

                                            </strong>

                                            <span>

                                                Stock •
                                                ${stock.display_symbol
                                            || stock.symbol}

                                            </span>

                                        </div>

                                    `;


                                        suggestionBox.appendChild(
                                            item
                                        );


                                    }

                                );


                            }


                            catch (
                            error
                            ) {


                                suggestionBox.innerHTML = `

                                <div class="no-search-result">

                                    Unable to search stocks

                                </div>

                            `;


                            }


                        },

                        350

                    );


                }

            );



            /* SUBMIT FIRST RESULT */


            searchInput
                .closest("form")
                .addEventListener(

                    "submit",

                    function (event) {


                        const firstResult =

                            suggestionBox.querySelector(

                                ".stock-suggestion-item"

                            );


                        if (
                            firstResult
                        ) {


                            event.preventDefault();


                            window.location.href =

                                firstResult.href;


                        }


                    }

                );



            /* CLOSE SEARCH RESULTS */


            document.addEventListener(

                "click",

                function (event) {


                    if (

                        !event.target.closest(

                            ".navbar-search-wrapper"

                        )

                    ) {


                        suggestionBox.classList.remove(

                            "show"

                        );


                    }


                }

            );



            /* OPEN AGAIN ON CLICK */


            searchInput.addEventListener(

                "focus",

                function () {


                    if (

                        suggestionBox.innerHTML.trim()

                    ) {


                        suggestionBox.classList.add(

                            "show"

                        );


                    }


                }

            );


        }


    });

</script>
